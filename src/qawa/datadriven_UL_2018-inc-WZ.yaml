                #                     description="Number of jets"),
                #         cs.Variable(name="tau_pt", type="real",
                #                     description="Tau pT [GeV]"),
                #     ],
                #     output=cs.Variable(name="weight", type="real",
                #                        description="DD estimate weight"),
