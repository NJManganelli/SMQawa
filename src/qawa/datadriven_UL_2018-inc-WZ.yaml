datadriven:
    DDDY:
        Corrections:
            LNTTau_to_VTTau_TransferFactor:
                method: inc_WZ_DYDD_TransferFactor
                # fake-rate binning as merge-widths over the input tau_pt grid. With 5-GeV input
                # bins (Regular(120, 0, 600), the current processor output) this gives edges
                # [0,20,25,30,35,40,60,80,100,600], matching the legacy hard-coded fake-rate scheme:
                rebin: [4, 1, 1, 1, 1, 4, 4, 4, 100]
                # Legacy 10-GeV input bins (Regular(60, 0, 600)) -> [0,20,30,40,60,80,100,600]:
                # rebin: [2, 1, 1, 2, 2, 2, 50]
                correctionset_flow: clamp
                correctionset_top_description: loose-not-tight tau to very-tight tau fake rate for Drell-Yan
                correctionset_output_label: fake_rate
                correctionset_output_description: fake rate for Drell-Yan
                channels:
                    inc-D0: tau_pt_vtight
                    inc-D1: tau_pt_vtight
                    inc-C0: tau_pt_loose
                    inc-C1: tau_pt_loose
                channel_ratios:
                    0:
                        numerator: inc-D0
                        denominator: inc-C0
                    1:
                        numerator: inc-D1
                        denominator: inc-C1
                update_axes_meta:
                    # rename tau_pt_loose axis name so that histograms can be added consistently
                    tau_pt_loose:
                        name: tau_pt
                    tau_pt_vtight:
                        name: tau_pt
                dict_to_hist_axis:
                    axis_name: jet_multiplicity
                    axis_label: Number of jets
                    axis_type: Regular
                    axis_storage: Weight
            LNTTau_HighMET_DY_to_Data_Estimate:
                method: inc_WZ_DYDD_ProbDY
                # fake-rate binning as merge-widths over the input tau_pt grid. With 5-GeV input
                # bins (Regular(120, 0, 600), the current processor output) this gives edges
                # [0,20,25,30,35,40,60,80,100,600], matching the legacy hard-coded fake-rate scheme:
                rebin: [4, 1, 1, 1, 1, 4, 4, 4, 100]
                # Legacy 10-GeV input bins (Regular(60, 0, 600)) -> [0,20,30,40,60,80,100,600]:
                # rebin: [2, 1, 1, 2, 2, 2, 50]
                correctionset_flow: clamp
                correctionset_top_description: tau_pt parametrized probability event is from Drell-Yan
                correctionset_output_label: prob_dy
                correctionset_output_description: probability event comes from Drell-Yan
                channels:
                    inc-B0: tau_pt_loose
                    inc-B1: tau_pt_loose
                channel_absolutes:
                    0: inc-B0
                    1: inc-B1
                update_axes_meta:
                    # rename tau_pt_loose axis name so that histograms can be added consistently
                    tau_pt_loose:
                        name: tau_pt
                    tau_pt_vtight:
                        name: tau_pt
                dict_to_hist_axis:
                    axis_name: jet_multiplicity
                    axis_label: Number of jets
                    axis_type: Regular
                    axis_storage: Weight
            LNTTau_LowMET_DY_to_Data_Estimate:
                method: inc_WZ_DYDD_ProbDY
                # fake-rate binning as merge-widths over the input tau_pt grid. With 5-GeV input
                # bins (Regular(120, 0, 600), the current processor output) this gives edges
                # [0,20,25,30,35,40,60,80,100,600], matching the legacy hard-coded fake-rate scheme:
                rebin: [4, 1, 1, 1, 1, 4, 4, 4, 100]
                # Legacy 10-GeV input bins (Regular(60, 0, 600)) -> [0,20,30,40,60,80,100,600]:
                # rebin: [2, 1, 1, 2, 2, 2, 50]
                correctionset_flow: clamp
                correctionset_top_description: tau_pt parametrized probability event is from Drell-Yan
                correctionset_output_label: prob_dy
                correctionset_output_description: probability event comes from Drell-Yan
                channels:
                    inc-C0: tau_pt_loose
                    inc-C1: tau_pt_loose
                channel_absolutes:
                    0: inc-C0
                    1: inc-C1
                update_axes_meta:
                    # rename tau_pt_loose axis name so that histograms can be added consistently
                    tau_pt_loose:
                        name: tau_pt
                    tau_pt_vtight:
                        name: tau_pt
                dict_to_hist_axis:
                    axis_name: jet_multiplicity
                    axis_label: Number of jets
                    axis_type: Regular
                    axis_storage: Weight

        CompoundCorrections:
            LNTTau_VTTau_DDDY_Closure:
                correctionset_top_description: tau_pt parametrized Drell-Yan closure weight combining LowMET DY probability with LNT to VT Tau fake rate
                correctionset_output_label: dddy_closure
                correctionset_output_type: real
                correctionset_output_description: data-driven Drell-Yan fake rate weight combining LNT to VT tau fake rate with Probability DY from the LowMET region
                inputs_update: []
                input_op: "*"
                output_op: "*"
                stack: ["LNTTau_to_VTTau_TransferFactor", "LNTTau_LowMET_DY_to_Data_Estimate"]
            LNTTau_VTTau_DDDY_Estimate:
                correctionset_top_description: tau_pt parametrized Drell-Yan fake rate weight combining HighMET DY probability with LNT to VT Tau fake rate
                correctionset_output_label: dddy_estimate
                correctionset_output_type: real
                correctionset_output_description: data-driven Drell-Yan fake rate weight combining LNT to VT tau fake rate with Probability DY from the HighMET region
                inputs_update: []
                input_op: "*"
                output_op: "*"
                stack: ["LNTTau_to_VTTau_TransferFactor", "LNTTau_HighMET_DY_to_Data_Estimate"]
                # inputs:
                #     name: "jet_multiplicity"
                
