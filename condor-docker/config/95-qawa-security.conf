# SMQawa local pool — shared pool-password auth over the private docker bridge.
#
# The blob at SEC_PASSWORD_FILE is created once by setup-condor-docker.sh
# (condor_store_cred) into the `secrets` volume shared by every node.

SEC_PASSWORD_FILE = /etc/condor/secrets/pool_password

SEC_DEFAULT_AUTHENTICATION         = REQUIRED
# FS first so a co-located client (condor_submit / python bindings -> local schedd)
# authenticates as the real unix user (valid submitter / user record), not the pool
# identity condor@password. Cross-host daemon<->daemon can't use FS (separate /tmp)
# and transparently falls back to the shared pool PASSWORD.
SEC_DEFAULT_AUTHENTICATION_METHODS = FS, PASSWORD
SEC_CLIENT_AUTHENTICATION_METHODS  = FS, PASSWORD
SEC_DEFAULT_INTEGRITY              = REQUIRED
SEC_DEFAULT_ENCRYPTION             = OPTIONAL

# Everyone on this trusted, isolated bridge may talk to everyone.
ALLOW_READ          = *
ALLOW_WRITE         = *
ALLOW_DAEMON        = *
ALLOW_NEGOTIATOR    = *
ALLOW_ADMINISTRATOR = *
ALLOW_CONFIG        = *
