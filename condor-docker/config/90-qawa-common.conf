# SMQawa local pool — common settings (numbered 90 so it overrides image drop-ins).

# Central manager is the `cm` service on the private docker bridge.
CONDOR_HOST = cm

# Snappy intervals for local development (production defaults are much longer).
UPDATE_INTERVAL          = 5
NEGOTIATOR_INTERVAL      = 15
SCHEDD_INTERVAL          = 15
STARTER_UPDATE_INTERVAL  = 5
SHADOW_QUEUE_UPDATE_INTERVAL = 10

# Let DAGMan node status files refresh quickly.
DAGMAN_USER_LOG_SCAN_INTERVAL = 3

# Bind to whatever the container network hands us.
NETWORK_INTERFACE = *
