# SMQawa local pool — worker (STARTD) tuning.
# Applied on every node but only meaningful where a STARTD runs.

# Guarantee slots even if CPU auto-detection is conservative inside the container.
NUM_CPUS = 2

# Start jobs immediately and never suspend/preempt in a local test pool.
START      = TRUE
SUSPEND    = FALSE
PREEMPT    = FALSE
KILL       = FALSE
WANT_HOLD  = FALSE

# Release idle claims quickly so `condor_status` reflects reality during testing.
CLAIM_WORKLIFE            = 60
STARTD_NOCLAIM_TIMEOUT    = 120
